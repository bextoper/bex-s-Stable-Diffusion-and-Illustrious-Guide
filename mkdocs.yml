site_name: bex's Stable Diffusion And Illustrious Guide
copyright: Made by @bextoper in 2026.
extra:
    social:
      - icon: fontawesome/brands/discord
        link: https://discord.com/users/391965346761801738
        name: bextoper
nav:
    - Introduction: index.md
    - IMPORTANT. Re-usage of My Prompt/Generations: reusage.md
    - Installing Stable Diffusion; ForgeUI: forge_guide.md
    - Illustrious Guide; Basics: illustrious_guide.md
    - Advanced Section: advanced.md
    - ComfyUI Guide: comfy_guide.md
    - Conclusion: conclusion.md
    - Special Thanks: thanks.md
    - To-Do List: todo.md
    - Update History: updates.md
theme:
  name: material
  palette:
    # Dark by default, with a toggle to switch to light
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - markdown_include.include:
      base_path: .
  - admonition
  - attr_list
  - md_in_html
extra_css:
  - stylesheets/extra.css
